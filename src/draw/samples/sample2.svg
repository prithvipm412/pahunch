<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <rect width="640" height="640" fill="#FBF9F5" rx="16"/>
  <rect x="24" y="24" width="592" height="592" fill="none" stroke="#E2E8F0" stroke-width="2" rx="12"/>
  <text x="320" y="70" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="20" fill="#1E293B">Two Bulbs in Parallel (Hand-drawn)</text>

  <g stroke="#0F172A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top bus wire -->
    <line x1="140" y1="140" x2="480" y2="140"/>
    <!-- Bottom return wire -->
    <line x1="140" y1="500" x2="480" y2="500"/>

    <!-- Left battery branch -->
    <line x1="140" y1="140" x2="140" y2="300"/>
    <!-- Battery -->
    <line x1="110" y1="300" x2="170" y2="300" stroke-width="4"/>
    <line x1="122" y1="325" x2="158" y2="325" stroke-width="7"/>
    <line x1="140" y1="325" x2="140" y2="500"/>

    <!-- Junction dots on top bus -->
    <circle cx="310" cy="140" r="6" fill="#0F172A"/>
    <circle cx="480" cy="140" r="6" fill="#0F172A"/>

    <!-- Junction dots on bottom bus -->
    <circle cx="310" cy="500" r="6" fill="#0F172A"/>
    <circle cx="480" cy="500" r="6" fill="#0F172A"/>

    <!-- Branch 1 (Bulb 1) -->
    <line x1="310" y1="140" x2="310" y2="295"/>
    <circle cx="310" cy="320" r="25"/>
    <line x1="292" y1="302" x2="328" y2="338"/>
    <line x1="328" y1="302" x2="292" y2="338"/>
    <line x1="310" y1="345" x2="310" y2="500"/>

    <!-- Branch 2 (Bulb 2) -->
    <line x1="480" y1="140" x2="480" y2="295"/>
    <circle cx="480" cy="320" r="25"/>
    <line x1="462" y1="302" x2="498" y2="338"/>
    <line x1="498" y1="302" x2="462" y2="338"/>
    <line x1="480" y1="345" x2="480" y2="500"/>
  </g>

  <!-- Labels -->
  <text x="310" y="375" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="middle">Bulb 1</text>
  <text x="480" y="375" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="middle">Bulb 2</text>
  <text x="95" y="290" font-family="sans-serif" font-weight="bold" font-size="18" fill="#DC2626">+</text>
  <text x="95" y="345" font-family="sans-serif" font-weight="bold" font-size="18" fill="#2563EB">−</text>
  <text x="75" y="320" font-family="sans-serif" font-size="14" fill="#475569">3V</text>
</svg>