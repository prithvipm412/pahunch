<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <rect width="640" height="640" fill="#FBF9F5" rx="16"/>
  <rect x="24" y="24" width="592" height="592" fill="none" stroke="#E2E8F0" stroke-width="2" rx="12"/>
  <text x="320" y="70" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="20" fill="#1E293B">Bulb &amp; Resistor Circuit (Hand-drawn)</text>

  <g stroke="#0F172A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top wire to Bulb -->
    <line x1="140" y1="140" x2="285" y2="140"/>
    <circle cx="310" cy="140" r="25"/>
    <line x1="292" y1="122" x2="328" y2="158"/>
    <line x1="328" y1="122" x2="292" y2="158"/>
    <line x1="335" y1="140" x2="500" y2="140"/>

    <!-- Right side: Resistor -->
    <line x1="500" y1="140" x2="500" y2="250"/>
    <!-- Zigzag resistor -->
    <path d="M 500 250 L 525 265 L 475 290 L 525 315 L 475 340 L 525 365 L 475 390 L 500 405"/>
    <line x1="500" y1="405" x2="500" y2="500"/>

    <!-- Bottom return wire -->
    <line x1="500" y1="500" x2="140" y2="500"/>

    <!-- Left battery -->
    <line x1="140" y1="140" x2="140" y2="300"/>
    <line x1="110" y1="300" x2="170" y2="300" stroke-width="4"/>
    <line x1="122" y1="325" x2="158" y2="325" stroke-width="7"/>
    <line x1="140" y1="325" x2="140" y2="500"/>
  </g>

  <!-- Labels -->
  <text x="310" y="105" font-family="sans-serif" font-size="14" fill="#475569" text-anchor="middle">Bulb</text>
  <text x="545" y="335" font-family="sans-serif" font-size="14" fill="#475569">10 Ω</text>
  <text x="95" y="290" font-family="sans-serif" font-weight="bold" font-size="18" fill="#DC2626">+</text>
  <text x="95" y="345" font-family="sans-serif" font-weight="bold" font-size="18" fill="#2563EB">−</text>
  <text x="75" y="320" font-family="sans-serif" font-size="14" fill="#475569">9V</text>
</svg>